name: Source package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  patch-applicability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Git LFS if needed
        run: |
          if ! git lfs version; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
      - name: Fetch pinned sources and check patches
        run: |
          python scripts/prepare.py --source "$RUNNER_TEMP/darling-src" --jobs 4
          python scripts/prepare.py --source "$RUNNER_TEMP/darling-src" --check-only
  nix-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - run: nix build .#checks.x86_64-linux.fonts --no-link -L
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require C++ regression compiler
        run: |
          command -v c++
          c++ --version
      - run: python scripts/validate.py
      - run: python tools/riot-input-offline-check.py
      - run: python tools/riot-launcher-offline-check.py
      - run: python tools/riot-runtime-cleanup-offline-check.py
      - run: python tools/riot-cdn-dns-offline-check.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
